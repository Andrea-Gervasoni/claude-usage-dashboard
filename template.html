<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario d'uso</title>
<meta name="description" content="Il mio uso di Claude Code giorno per giorno: token, costi stimati, modelli. Dati locali letti con ccusage.">
<meta name="theme-color" content="#E9F1F5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg stroke='%23DC6A32' stroke-width='7' stroke-linecap='round'%3E%3Cpath d='M32 6v14M32 44v14M6 32h14M44 32h14M13.6 13.6l9.9 9.9M40.5 40.5l9.9 9.9M50.4 13.6l-9.9 9.9M23.5 40.5l-9.9 9.9'/%3E%3C/g%3E%3C/svg%3E">
<style>
/*__FONTS__*/

/* Impianto: un solo palcoscenico (canvas) con i giorni come attori; le sezioni sono campi di colore pieni che gli scorrono sotto. */
:root{
  --sky:#E9F1F5;        /* cielo chiaro: prima vista, costi, chiusura */
  --azure:#C3D7E2;      /* azzurro polveroso: calendario */
  --ink:#0F1B24;        /* inchiostro: testo e campi scuri */
  --orange:#DC6A32;     /* accento: ciò che scrive Claude, i picchi */
  --ink-soft:#33455A; --ink-muted:#425466; --orange-text:#9A3D14;
  --on-ink:#EAF1F5; --on-ink-muted:#A9BCC9; --on-ink-orange:#F08A56;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-s:14px; --fs-m:17px; --fs-l:20px;
  --fs-h2:clamp(32px,4.1vw,60px); --fs-h1:clamp(40px,5.7vw,88px);
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.65,0,.35,1);
  --t-fast:.2s; --t-scene:.95s;
  --gutter:clamp(20px,4.6vw,72px); --sheet:36px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--sky)}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--sans);font-size:var(--fs-m);line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--orange);color:#fff}
.num{font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
h1{font-size:var(--fs-h1)} h2{font-size:var(--fs-h2)}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:8px}

/* ── palcoscenico e apertura ─────────────────────────────── */
#stage{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#stage.front{z-index:41}
#cover{position:fixed;inset:0;z-index:40;background:var(--ink);color:var(--on-ink);cursor:pointer}
#cover.gone{display:none}
#coverRead{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;transition:opacity .3s}
#coverRead b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.4vw,60px);line-height:1}
#coverRead span{font-size:var(--fs-s);color:var(--on-ink-muted)}
#cover.closing #coverRead{opacity:0}

/* ── sezioni: campi pieni che salgono come fogli ─────────── */
.s{position:relative;padding:clamp(88px,15vh,168px) 0 calc(clamp(88px,15vh,168px) + var(--sheet))}
.s + .s{margin-top:calc(-1 * var(--sheet));border-radius:var(--sheet) var(--sheet) 0 0}
.wrap{position:relative;z-index:2;max-width:1280px;margin:0 auto;
  padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.s-hero{background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 45%,var(--azure) 100%);padding-top:0;min-height:100vh;min-height:100svh;display:flex;align-items:center}
.s-hero .wrap{width:100%}
.s-cal{background:var(--azure)}
.s-tok,.s-led{background:var(--ink);color:var(--on-ink)}
.s-cost,.s-end{background:var(--sky)}
.s-mod{background:var(--orange)}
.s-end{padding-bottom:160px;min-height:100vh;min-height:100svh;display:flex;align-items:center}
.s-end .wrap{width:100%}
.is-empty .s:not(.s-hero){display:none}

.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,88px);align-items:start}
.txt p{color:var(--ink-soft);max-width:44ch;margin-top:22px}
.s-tok .txt p,.s-led .txt p{color:var(--on-ink-muted)}
.s-mod .txt p{color:var(--ink)}
.acc{color:var(--orange-text);white-space:nowrap;font-weight:400}
.s-tok .acc,.s-led .acc{color:var(--on-ink-orange)}
.s-mod .acc{color:var(--ink)}
.strong{font-weight:600;color:var(--ink)}
.anchor{position:relative;width:100%}
.hit{position:absolute;inset:0;touch-action:pan-y;cursor:crosshair}
.ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ov text{font-family:var(--sans);font-size:12px;fill:var(--ink-muted)}
.s-tok .ov text{fill:var(--on-ink-muted)}
.ov .grid{stroke:rgba(15,27,36,.12)} .s-tok .ov .grid{stroke:rgba(234,241,245,.13)}
.readout{min-height:3.1em;margin-top:16px;font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.readout b{font-weight:600;color:var(--ink)}
.s-tok .readout{color:var(--on-ink-muted)} .s-tok .readout b{color:var(--on-ink)}
.readout .it{white-space:nowrap;margin-right:14px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

/* prima vista */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:center;padding-top:96px;padding-bottom:120px}
.hero h1{max-width:13ch}
.lede{font-size:var(--fs-l);color:var(--ink-soft);max-width:36ch;margin-top:28px;opacity:0;transform:translateY(10px);transition:opacity .8s .5s,transform .8s var(--ease-out) .5s}
.in + .lede{opacity:1;transform:none}
#a-spark{aspect-ratio:1;max-width:640px;margin:0 auto}
#a-spark .hit{border-radius:50%}
.readout-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:27%;text-align:center;pointer-events:none;line-height:1.15}
.readout-c b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(20px,2.3vw,34px)}
.readout-c span{display:block;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.cap{font-size:var(--fs-s);color:var(--ink-muted);text-align:center;margin-top:10px;opacity:0;transition:opacity .8s 1s}
.hero.in .cap{opacity:1}

/* calendario */
.cal-legend{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-muted);margin-top:18px}
.cal-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* token: righe-legenda che si premono */
.kinds{list-style:none;margin:30px 0 0;padding:0;border-top:1px solid rgba(234,241,245,.16)}
.kind{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid rgba(234,241,245,.16);padding:14px 0;cursor:pointer;min-height:44px;
  transition:opacity var(--t-fast)}
.kind i{width:10px;height:10px;border-radius:3px;align-self:center;transition:transform .35s var(--ease-out),background var(--t-fast),box-shadow var(--t-fast)}
.kind .kn{font-weight:600;display:inline-block;transition:transform .1s;transform-origin:0 50%}
.kind .kv{font-variant-numeric:tabular-nums;font-weight:500}
.kind .kd{grid-column:2/-1;font-size:var(--fs-s);color:var(--on-ink-muted)}
.kind:active .kn{transform:scale(.97)}
.kind[aria-pressed="false"]{opacity:.5}
.kind[aria-pressed="false"] i{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--on-ink-muted);transform:scale(.8)}
#a-tok{height:clamp(280px,48vh,460px)}
.compo{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:26px;background:rgba(234,241,245,.1)}
.compo i{flex-basis:0;flex-grow:0;transition:flex-grow 1.2s var(--ease-out)}

/* costi */
#a-cost{height:clamp(240px,40vh,380px)}
#cum{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.months{margin-top:clamp(64px,10vh,120px)}
.months h3{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 18px}
.mrow{display:grid;grid-template-columns:minmax(120px,1.4fr) minmax(0,6fr) minmax(86px,auto);gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(15,27,36,.12)}
.mrow .mn{font-family:var(--serif);font-size:22px}
.mrow .mt{height:16px;border-radius:5px;background:rgba(15,27,36,.07)}
.mrow .mc{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}

/* modelli */
.models{list-style:none;margin:0;padding:0}
.models li{padding:22px 0;border-bottom:1.5px solid rgba(15,27,36,.28);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:baseline}
.models li:first-child{border-top:1.5px solid rgba(15,27,36,.28)}
.models .mname{font-family:var(--serif);font-size:clamp(30px,3.4vw,48px);line-height:1}
.models .mcost{font-family:var(--serif);font-size:clamp(24px,2.6vw,36px);font-variant-numeric:tabular-nums}
.models .mbar{grid-column:1/-1;height:12px;border-radius:99px;background:rgba(15,27,36,.16);overflow:hidden;margin:8px 0 4px}
.models .mbar i{display:block;height:100%;width:100%;border-radius:99px;background:var(--ink);transform:scaleX(0);transform-origin:0 50%;transition:transform 1.3s var(--ease-out);transition-delay:calc(var(--i)*120ms + .15s)}
.in .models .mbar i{transform:scaleX(var(--w))}
.models .msub{grid-column:1/-1;font-size:15px;font-variant-numeric:tabular-nums}

/* registro */
.ledger-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.led-head{margin-bottom:clamp(36px,6vh,64px)} .led-head h2{max-width:18ch}
td:first-child{white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:660px}
th{font-weight:500;font-size:13px;color:var(--on-ink-muted);text-align:right;padding:10px 0 12px 16px;border-bottom:1px solid rgba(234,241,245,.3)}
td{text-align:right;padding:14px 0 14px 16px;border-bottom:1px solid rgba(234,241,245,.14);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:0}
td:first-child{font-family:var(--serif);font-size:21px}
td.cost{color:var(--on-ink-orange);font-weight:500}
tfoot td{border-bottom:0;border-top:1.5px solid var(--on-ink);font-weight:600}
tfoot td:first-child{font-weight:400}
tbody tr,tfoot tr{clip-path:inset(0 0 100% 0);opacity:0;transition:clip-path .7s var(--ease-out),opacity .5s;transition-delay:calc(var(--i)*70ms + .1s)}
.in tbody tr,.in tfoot tr{clip-path:inset(0 0 0 0);opacity:1}

/* chiusura */
.end{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,5vw,88px);align-items:center}
#a-end{aspect-ratio:1;max-width:400px;margin:0 auto}
.end p{color:var(--ink-soft);max-width:52ch;margin-top:16px;font-size:16px}
.end code{font-size:13px;background:rgba(15,27,36,.07);padding:2px 6px;border-radius:5px}

/* ── entrate: una per sezione, stesso accento ────────────── */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.16em;margin-bottom:-.16em}
.w>span{display:inline-block;transform:translateY(115%);transition:transform var(--t-scene) var(--ease-out);transition-delay:calc(var(--i)*40ms)}
.in .w>span{transform:none}
.e-wipe{clip-path:inset(-5% 100% -12% 0);transition:clip-path 1.15s var(--ease-io)}
.in>.e-wipe{clip-path:inset(-5% -2% -12% 0)}
.e-wipe .w,.e-drop .w{overflow:visible} .e-wipe .w>span,.e-drop .w>span{transform:none}
.e-drop{clip-path:inset(0 0 100% 0);transform:translateY(-14px);transition:clip-path 1s var(--ease-out),transform 1s var(--ease-out)}
.in>.e-drop{clip-path:inset(0 0 -14% 0);transform:none}
.e-flip .w{overflow:visible;perspective:700px}
.e-flip .w>span{transform:rotateX(-86deg);transform-origin:50% 0;opacity:0;transition:transform .8s var(--ease-out),opacity .3s;transition-delay:calc(var(--i)*45ms)}
.in>.e-flip .w>span{transform:none;opacity:1}
.e-slide .w{overflow:visible}
.e-slide .w>span{transform:translateX(-36px);opacity:0;transition:transform .9s var(--ease-out),opacity .5s;transition-delay:calc(var(--i)*45ms)}
.in>.e-slide .w>span{transform:none;opacity:1}
.fade{opacity:0;transition:opacity .8s .35s} .in>.fade{opacity:1}

/* ── liquid glass: solo menu e filtri ────────────────────── */
.glass{position:fixed;z-index:30;border-radius:999px;--g-ink:#13202A;--g-tint:rgba(255,255,255,.44);--g-ind:rgba(255,255,255,.82);--g-ind-ink:#0F1B24;--rim:0deg;
  color:var(--g-ink);background:var(--g-tint);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -1.5px 1.5px rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -8px 14px -10px rgba(15,27,36,.25),
    0 1px 2px rgba(10,20,30,.12),0 12px 32px -10px rgba(10,20,30,.34);
  transition:background .4s,color .4s,opacity .6s,translate .9s var(--ease-out);opacity:0;translate:0 var(--from,0)}
.glass.on{opacity:1;translate:0 0}
.glass[data-on="dark"]{--g-ink:#EAF1F5;--g-tint:rgba(15,27,36,.4);--g-ind:rgba(234,241,245,.9);--g-ind-ink:#0F1B24}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;
  background:conic-gradient(from var(--rim),rgba(255,255,255,.95),rgba(255,255,255,.1) 20%,rgba(255,170,190,.3) 44%,rgba(255,255,255,.5) 50%,rgba(150,205,255,.34) 56%,rgba(255,255,255,.1) 80%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.seg-in{position:relative;display:flex;padding:5px;border-radius:inherit}
.press{position:relative;z-index:1;appearance:none;border:0;background:none;cursor:pointer;border-radius:999px;padding:0 15px;height:38px;
  font-size:15px;font-weight:500;white-space:nowrap;color:var(--g-ink);opacity:.82;transition:opacity var(--t-fast),color .3s;-webkit-tap-highlight-color:transparent}
.press>span{display:inline-block;transition:transform .1s ease-out}
.press:active>span{transform:scale(.94)}
.press i{font-style:normal} .press .sm{display:none}
.press:hover{opacity:1}
.press[aria-pressed="true"],.press[aria-current="true"]{opacity:1;color:var(--g-ind-ink);font-weight:600}
.ind{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--g-ind);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(10,20,30,.18),0 6px 14px -6px rgba(10,20,30,.35);transition:background .4s}
#brand{top:max(16px,env(safe-area-inset-top,0px));left:max(var(--gutter),env(safe-area-inset-left,0px));--from:-18px;height:48px;padding:0 20px;
  font-family:var(--serif);font-size:22px;border:0;cursor:pointer}
#brand>span{display:inline-block;transition:transform .1s ease-out} #brand:active>span{transform:scale(.95)}
#range{top:max(16px,env(safe-area-inset-top,0px));right:max(var(--gutter),env(safe-area-inset-right,0px));--from:-18px}
#dock{bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;--from:26px;transform:translateX(-50%)}

/* ── telefono e tablet: composizione propria ─────────────── */
@media (max-width:900px){
  .two,.end{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;padding-top:84px;padding-bottom:110px;gap:8px}
  .hero-fig{order:-1}
  #a-spark{max-width:min(76vw,40svh)}
  .hero h1{max-width:none}
  .lede{margin-top:18px}
  #a-end{max-width:300px}
  .s-end{padding-bottom:140px}
  .mrow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .mrow .mt{grid-column:1/-1;order:3}
}
@media (max-width:560px){
  .press{padding:0 11px;font-size:14px;height:44px}
  #brand{height:54px;font-size:20px;padding:0 16px}
  #dock .press[data-go="top"]{display:none}
  .press .lg{display:none} .press .sm{display:inline}
  .readout{font-size:14px;min-height:5.6em}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>
<div id="cover" aria-hidden="true"><div id="coverRead"><b class="num" id="coverNum">0</b><span>giorni letti</span></div></div>
<svg id="defs" width="0" height="0" aria-hidden="true" style="position:absolute"></svg>

<button class="glass" id="brand" aria-label="Diario d'uso, torna all'inizio"><span>Diario d'uso</span></button>
<div class="glass" id="range" role="group" aria-label="Periodo"><div class="seg-in"><i class="ind"></i>
  <button class="press" data-range="7d" aria-pressed="false"><span><i class="lg">7 giorni</i><i class="sm">7g</i></span></button>
  <button class="press" data-range="30d" aria-pressed="false"><span><i class="lg">30 giorni</i><i class="sm">30g</i></span></button>
  <button class="press" data-range="6m" aria-pressed="true"><span>6 mesi</span></button>
  <button class="press" data-range="all" aria-pressed="false"><span>Tutto</span></button>
</div></div>
<nav class="glass" id="dock" aria-label="Sezioni"><div class="seg-in"><i class="ind"></i>
  <button class="press" data-go="top"><span>Panoramica</span></button>
  <button class="press" data-go="calendario"><span>Calendario</span></button>
  <button class="press" data-go="token"><span>Token</span></button>
  <button class="press" data-go="costi"><span>Costi</span></button>
  <button class="press" data-go="modelli"><span>Modelli</span></button>
  <button class="press" data-go="mesi"><span>Registro</span></button>
</div></nav>

<main id="main">
  <section class="s s-hero" id="top" data-field="light">
    <div class="wrap hero" id="heroWrap">
      <div class="hero-text">
        <h1 id="h-hero"></h1>
        <p class="lede" id="p-hero"></p>
      </div>
      <div class="hero-fig">
        <div class="anchor" id="a-spark"><div class="readout-c" id="r-spark" aria-live="polite"></div><div class="hit" id="hit-spark"></div></div>
        <p class="cap" id="cap-spark"></p>
      </div>
    </div>
  </section>

  <section class="s s-cal" id="calendario" data-field="light">
    <div class="wrap two">
      <div class="txt" data-in><h2 class="e-wipe" id="h-cal"></h2><p class="fade" id="p-cal"></p></div>
      <div>
        <div class="anchor" id="a-cal"><svg class="ov" id="ov-cal"></svg><div class="hit" id="hit-cal"></div></div>
        <div class="cal-legend" aria-hidden="true">meno <i style="background:#B3C8D4"></i><i style="background:#8FAFC2"></i><i style="background:#5F89A3"></i><i style="background:#35627E"></i><i style="background:#173F59"></i> più token</div>
        <p class="readout" id="r-cal" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <section class="s s-tok" id="token" data-field="dark">
    <div class="wrap two">
      <div class="txt" data-in id="tokTxt">
        <h2 class="e-drop" id="h-tok"></h2>
        <p class="fade" id="p-tok"></p>
        <ul class="kinds fade" id="kinds"></ul>
      </div>
      <div>
        <div class="compo" id="compo" aria-hidden="true"></div>
        <div class="anchor" id="a-tok"><svg class="ov" id="ov-tok"></svg><div class="hit" id="hit-tok"></div></div>
        <p class="readout" id="r-tok" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <section class="s s-cost" id="costi" data-field="light">
    <div class="wrap">
      <div class="two">
        <div class="txt" data-in><h2 class="e-flip" id="h-cost"></h2><p class="fade" id="p-cost"></p></div>
        <div>
          <div class="anchor" id="a-cost"><svg class="ov" id="ov-cost"></svg><div class="hit" id="hit-cost"></div></div>
          <p class="readout" id="r-cost" aria-live="polite"></p>
        </div>
      </div>
      <div class="months">
        <h3>Costo stimato per mese</h3>

      <div class="ledger-wrap" data-in>

</main>

<script>
const DATA = /*__DATA__*/null;
(() => {
"use strict";
const days = (DATA && DATA.days) || {};
const allDates = Object.keys(days).sort();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(hover: none) and (pointer: coarse)").matches;
const $ = (s) => document.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

const SERIES = [
  { key: "cacheRead", label: "Cache letta", hex: "#4F7890", def: "Conversazione e file già salvati, che Claude rilegge a ogni turno." },
  { key: "cacheCreation", label: "Cache scritta", hex: "#86AEC4", def: "Contesto nuovo che viene salvato per i turni successivi." },
  { key: "input", label: "Input", hex: "#DCE9F0", def: "Quello che scrivi tu, più ciò che Claude legge per la prima volta." },
  { key: "output", label: "Output", hex: "#F08A56", def: "Quello che scrive Claude: risposte, codice, comandi." },
];
SERIES.forEach((s) => (s.rgb = hex(s.hex)));
const active = new Set(SERIES.map((s) => s.key));

/* ── formattazione ─────────────────────────────────────────── */
const nf = (d) => new Intl.NumberFormat("it-IT", { maximumFractionDigits: d, minimumFractionDigits: d });
const int = new Intl.NumberFormat("it-IT");
const NB = " ";
function words(n) {
  if (n >= 1e9) { const s = nf(n >= 1e10 ? 1 : 2).format(n / 1e9); return s + NB + (/^1(,0+)?$/.test(s) ? "miliardo" : "miliardi"); }
  if (n >= 1e6) { const s = nf(n >= 1e7 ? 0 : 1).format(n / 1e6); return s + NB + (/^1(,0+)?$/.test(s) ? "milione" : "milioni"); }
  if (n >= 1e4) return nf(0).format(n / 1e3) + NB + "mila";
  return int.format(Math.round(n));
}
function compact(n) {
  if (n >= 1e9) return nf(n >= 1e10 ? 0 : 1).format(n / 1e9) + NB + "mld";
  if (n >= 1e6) return nf(n >= 1e7 ? 0 : 1).format(n / 1e6) + NB + "mln";
  if (n >= 1e4) return nf(0).format(n / 1e3) + NB + "mila";
  return int.format(Math.round(n));
}
const usdFmt = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const usd = (n) => usdFmt.format(n);
const usd0 = (n) => (n >= 100 ? "$" + int.format(Math.round(n)) : usd(n));
const pct = (x) => (x > 0 && x < 0.001 ? "meno dello 0,1%" : nf(x < 0.1 ? 1 : 0).format(x * 100) + "%");
const MONTHS = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
const longDate = (s) => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const midDate = (s) => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const shortDate = (s) => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const monthLabel = (k) => { const [y, m] = k.split("-").map(Number); return `${MONTHS[m - 1][0].toUpperCase()}${MONTHS[m - 1].slice(1)} ${y}`; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nb = (s) => String(s).replace(/ /g, NB);
function prettyModel(raw) {
  if (!raw || raw === "<synthetic>") return "Sintetico";
  const s = raw.replace(/^claude-/, "").replace(/-\d{8}$/, "").replace(/@.*$/, "");
  const fam = (s.match(/opus|sonnet|haiku|fable|instant/) || [])[0];
  if (!fam) return raw;
  const ver = s.replace(fam, "").split("-").filter((x) => /^\d+$/.test(x)).join(".");
  return fam[0].toUpperCase() + fam.slice(1) + (ver ? " " + ver : "");
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

/* titoli: *x* = la cifra del fatto, in accento. Ogni parola è un pezzo animabile; il senso resta in aria-label. */
function heading(el, str) {
  el.setAttribute("aria-label", str.replace(/\*/g, ""));
  let i = 0;
  el.innerHTML = str.split(" ").map((tok) => {
    const m = tok.match(/^\*(.+?)\*(.*)$/);
    const inner = m ? `<b class="acc">${esc(m[1])}</b>${esc(m[2])}` : esc(tok);
    return `<span class="w" aria-hidden="true"><span style="--i:${i++}">${inner}</span></span>`;
  }).join(" ");
}

/* ── periodo ───────────────────────────────────────────────── */
const today = new Date(); today.setHours(0, 0, 0, 0);
const RANGE_NAMES = { "7d": "Negli ultimi sette giorni", "30d": "Negli ultimi trenta giorni", "6m": "Negli ultimi sei mesi", all: "Da quando tieni il diario" };
function rangeStart(r) {
  const d = new Date(today);
  if (r === "7d") d.setDate(d.getDate() - 6);
  else if (r === "30d") d.setDate(d.getDate() - 29);
  else if (r === "6m") { d.setMonth(d.getMonth() - 6); d.setDate(d.getDate() + 1); }
  else return allDates[0] ? parse(allDates[0]) : d;
  return d;
}
function sliceRange(r) {
  const requested = rangeStart(r);
  const first = allDates[0] ? parse(allDates[0]) : today;
  const start = requested < first ? first : requested;
  const lastData = allDates.length ? parse(allDates[allDates.length - 1]) : today;
  const end = lastData > today ? lastData : today;
  const list = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = iso(d), v = days[k];
    list.push({ date: k, input: v?.input || 0, output: v?.output || 0, cacheCreation: v?.cacheCreation || 0, cacheRead: v?.cacheRead || 0,
      cost: v?.cost || 0, models: v?.models || [], total: v ? (v.total || v.input + v.output + v.cacheCreation + v.cacheRead) : 0 });
  }
  return { list, clipped: requested < first };
}
function totals(list) {
  const t = { input: 0, output: 0, cacheCreation: 0, cacheRead: 0, cost: 0, total: 0 };
  for (const d of list) for (const k in t) t[k] += d[k];
  return t;
}
function byMonth(list) {
  const m = new Map();
  list.forEach((d, i) => {
    const k = d.date.slice(0, 7);
    if (!m.has(k)) m.set(k, { key: k, input: 0, output: 0, cacheCreation: 0, cacheRead: 0, cost: 0, total: 0, idx: [] });
    const o = m.get(k);
    for (const f of ["input", "output", "cacheCreation", "cacheRead", "cost", "total"]) o[f] += d[f];
    o.idx.push(i);
  });
  return [...m.values()];
}

/* ── stato ─────────────────────────────────────────────────── */
const S = { range: "6m", list: [], n: 0, t: null, months: [], maxTotal: 1, maxCost: 1, iMax: -1, iMaxCost: -1, clipped: false, empty: true, mMax: 1 };
const A = { hero: $("#a-spark"), cal: $("#a-cal"), tok: $("#a-tok"), cost: $("#a-cost"), mon: $("#a-mon"), end: $("#a-end") };
const ORDER = ["hero", "cal", "tok", "cost", "mon", "end"];
const P = {};          // pose statiche: P.cal[i] = {x,y,L,T,r,c}
const R = {};          // rettangoli delle ancore in coordinate di documento
let TR = [];           // transizioni fra pose consecutive: {s0,s1}
let FIELDS = [];       // sezioni: {top,bottom,field,id}
const H = { hero: -1, cal: -1, tok: -1, cost: -1 };   // giorno indicato dal puntatore, per posa
const hm = { hero: 0, cal: 0, tok: 0, cost: 0 };
const W = {}, Wt = {}; SERIES.forEach((s) => { W[s.key] = 1; Wt[s.key] = 1; });
let tokMax = 1, tokMaxT = 1, tokGeom = null, costGeom = null, calGeom = null;
let vw = innerWidth, vh = innerHeight;

function compute() {
  const sl = sliceRange(S.range);
  S.list = sl.list; S.n = sl.list.length; S.clipped = sl.clipped;
  S.t = totals(S.list); S.months = byMonth(S.list);
  S.maxTotal = Math.max(1, ...S.list.map((d) => d.total));
  S.maxCost = Math.max(1e-9, ...S.list.map((d) => d.cost));
  S.iMax = S.list.findIndex((d) => d.total === S.maxTotal && d.total > 0);
  S.iMaxCost = S.list.findIndex((d) => d.cost === S.maxCost && d.cost > 0);
  S.empty = S.t.total <= 0;
  S.mMax = Math.max(1e-9, ...S.months.map((m) => m.cost));
  const vals = S.list.filter((d) => d.total > 0).map((d) => d.total).sort((a, b) => a - b);
  const q = (p) => vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] ?? 0;
  const th = [q(.25), q(.5), q(.75)];
  S.level = S.list.map((d) => (d.total <= 0 ? 0 : d.total <= th[0] ? 1 : d.total <= th[1] ? 2 : d.total <= th[2] ? 3 : 4));
  S.order = S.list.map((_, i) => (S.n > 1 ? i / (S.n - 1) : 0));
  S.rnd = S.list.map((_, i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); });
}

/* colori dei giorni, posa per posa */
const C = {
  spark: ["#B7CAD5", "#86A8BC", "#5F89A3", "#35627E", "#173F59"].map(hex),
  sparkInk: ["#3B5568", "#5E86A0", "#86AEC4", "#B5D0DF", "#DCE9F0"].map(hex),
  cal: ["#B3C8D4", "#8FAFC2", "#5F89A3", "#35627E", "#173F59"].map(hex),
  cost: hex("#4A7690"), mon: [hex("#3E6A85"), hex("#5586A2")], orange: hex("#DC6A32"), orangeInk: hex("#F08A56"),
};

/* ── testi e parti DOM che dipendono dai dati ──────────────── */
function renderText() {
  const { list, t, n } = S;
  document.body.classList.toggle("is-empty", S.empty);
  const act = list.filter((d) => d.total > 0);
  if (S.empty) {
    heading($("#h-hero"), "Ancora nessuna traccia in questo periodo.");
    $("#p-hero").textContent = allDates.length ? "Prova un periodo più lungo dal selettore in alto." : "La storia è vuota. Lancia update.sh dopo aver usato Claude Code.";
    $("#cap-spark").textContent = ""; $("#r-spark").innerHTML = "";
    return;
  }
  // prima vista
  heading($("#h-hero"), `${RANGE_NAMES[S.range]} tu e Claude avete mosso *${words(t.total)}* di token.`);
  $("#p-hero").innerHTML = `Ai prezzi delle API valgono circa <span class="strong num">${usd(t.cost)}</span>, in ${act.length} ${act.length === 1 ? "giorno" : "giorni"} di lavoro.` +
    (S.clipped ? ` Il diario comincia il ${longDate(allDates[0])}.` : "");
  $("#cap-spark").textContent = "Ogni raggio è un giorno: più è lungo, più token sono passati.";
  sparkReadout(-1);
  // calendario
  let best = 0, cur = 0; list.forEach((d) => { cur = d.total > 0 ? cur + 1 : 0; best = Math.max(best, cur); });
  const top = list[S.iMax];
  const wd = [0, 0, 0, 0, 0, 0, 0]; act.forEach((d) => (wd[(parse(d.date).getDay() + 6) % 7] += d.total));
  const WD = ["il lunedì", "il martedì", "il mercoledì", "il giovedì", "il venerdì", "il sabato", "la domenica"];
  heading($("#h-cal"), `Hai lavorato con Claude *${act.length}${NB}${act.length === 1 ? "giorno" : "giorni"}* su ${n}.`);
  $("#p-cal").innerHTML = `Gli stessi giorni, messi in calendario. La serie più lunga è di <span class="strong">${best} ${best === 1 ? "giorno" : "giorni di fila"}</span>. Il giorno più intenso, in arancio, è il ${midDate(top.date)} con ${compact(top.total)} di token.` +
    (act.length > 13 ? ` Il giorno della settimana più carico è ${WD[wd.indexOf(Math.max(...wd))]}.` : "");
  readout("cal", -1);
  // token
  const ratio = t.output ? t.cacheRead / t.output : 0;
  heading($("#h-tok"), ratio >= 2 ? `Per ogni token che Claude scrive, ne rilegge *${int.format(Math.round(ratio))}*.` : `Di che cosa sono fatti i tuoi *${words(t.total)}* di token.`);
  $("#p-tok").textContent = "I giorni ora sono colonne: l'altezza è il numero di token. Quasi tutto è contesto riletto, e la parte scritta da Claude è il filo arancione in cima. Premi una voce per toglierla dal grafico.";
  $("#kinds").innerHTML = SERIES.slice().reverse().map((s) => `
    <li><button class="kind" data-k="${s.key}" aria-pressed="${active.has(s.key)}">
      <i style="background:${s.hex}"></i><span class="kn">${s.label}</span>
      <span class="kv">${pct(t[s.key] / t.total)}, ${compact(t[s.key])}</span>
      <span class="kd">${s.def}</span></button></li>`).join("");
  $("#compo").innerHTML = SERIES.map((s) => `<i data-g="${t[s.key] / t.total}" style="background:${s.hex}"></i>`).join("");
  readout("tok", -1);
  // costi
  const paid = list.filter((d) => d.cost > 0), avg = paid.length ? t.cost / paid.length : 0, topC = list[S.iMaxCost] || list[0];
  heading($("#h-cost"), `Ai prezzi delle API il periodo vale *${usd(t.cost)}*.`);
  $("#p-cost").innerHTML = `Le colonne sono il costo di ogni giorno, la linea è il totale che si accumula mentre scorri. In media <span class="strong num">${usd(avg)}</span> per giorno di lavoro. Il giorno più caro, in arancio, è il ${midDate(topC.date)} con ${usd(topC.cost)}. È una stima di ccusage: con un abbonamento non è quello che paghi.`;
  readout("cost", -1);
  A.mon.innerHTML = S.months.slice().reverse().map((m) => `<div class="mrow"><span class="mn">${monthLabel(m.key)}</span><span class="mt" data-m="${m.key}"></span><span class="mc">${usd(m.cost)}</span></div>`).join("");
  // modelli
  const agg = new Map();
  for (const d of list) for (const m of d.models) {
    const name = prettyModel(m.model);
    if (!agg.has(name)) agg.set(name, { name, total: 0, output: 0, cost: 0 });
    const o = agg.get(name);
    o.total += (m.input || 0) + (m.output || 0) + (m.cacheCreation || 0) + (m.cacheRead || 0); o.output += m.output || 0; o.cost += m.cost || 0;
  }
  const arr = [...agg.values()].filter((m) => m.total > 0).sort((a, b) => b.cost - a.cost || b.total - a.total);
  if (arr.length) {
    const tot = arr.reduce((a, m) => a + m.total, 0), totC = arr.reduce((a, m) => a + m.cost, 0);
    const share = (m) => (totC ? m.cost / totC : m.total / tot);
    heading($("#h-mod"), arr.length === 1 ? `Hai lavorato con un solo modello: *${nb(arr[0].name)}*.` : `*${nb(arr[0].name)}* pesa per il ${pct(share(arr[0]))} della spesa.`);
    $("#p-mod").textContent = arr.length === 1 ? "Quando ne userai altri, li troverai qui a confronto." : `Hai alternato ${arr.length} modelli. La barra è la parte di spesa stimata di ciascuno.`;
    $("#models").innerHTML = arr.map((m, i) => `<li><span class="mname">${esc(m.name)}</span><span class="mcost">${usd(m.cost)}</span>
      <span class="mbar"><i style="--w:${Math.max(.006, share(m))};--i:${i}"></i></span>
      <span class="msub">${pct(share(m))} della spesa, ${pct(m.total / tot)} dei token (${compact(m.total)}), ${compact(m.output)} scritti da Claude</span></li>`).join("");
  }
  // registro
  const months = S.months.filter((m) => m.total > 0).reverse();
  heading($("#h-led"), "Mese per mese, tutto quello che è passato.");
  const row = (label, o) => `<td>${label}</td><td>${int.format(o.input)}</td><td>${int.format(o.output)}</td><td>${int.format(o.cacheCreation)}</td><td>${int.format(o.cacheRead)}</td><td>${int.format(o.total)}</td><td class="cost">${usd(o.cost)}</td>`;
  $("#ledgerBody").innerHTML = months.map((m, i) => `<tr style="--i:${i}">${row(monthLabel(m.key), m)}</tr>`).join("");
  $("#ledgerFoot").innerHTML = months.length ? `<tr style="--i:${months.length}">${row("Totale periodo", t)}</tr>` : "";
  // chiusura
  const up = DATA && DATA.updatedAt ? new Date(DATA.updatedAt) : null;
  heading($("#h-end"), `Il diario comincia il *${nb(longDate(allDates[0]))}*.`);
  $("#colophon").innerHTML = `
    <p>Conta ${allDates.length} ${allDates.length === 1 ? "giorno registrato" : "giorni registrati"}.${up ? ` Ultimo aggiornamento: ${up.toLocaleString("it-IT", { dateStyle: "long", timeStyle: "short" })}.` : ""}</p>
    <p>I numeri vengono da <code>ccusage</code>, che legge i log locali di Claude Code. Ogni sera <code>update.sh</code> li unisce a <code>history.json</code> senza cancellare i giorni già salvati, così la storia resta anche quando i log vengono eliminati.</p>`;
}

/* letture a posto fisso: una riga sotto ogni grafico, mai un tooltip volante */
function sparkReadout(i) {
  const el = $("#r-spark"); if (S.empty) return;
  if (i < 0) { el.innerHTML = `<b>${S.n}</b><span>${S.n === 1 ? "giorno" : "giorni"}</span>`; return; }
  const d = S.list[i];
  el.innerHTML = `<b>${midDate(d.date)}</b><span>${d.total ? compact(d.total) + " token" : "nessun uso"}</span>`;
}
const hint = coarse ? "Tocca" : "Passa su";
function readout(kind, i) {
  const d = i >= 0 ? S.list[i] : null;
  if (kind === "cal") {
    $("#r-cal").innerHTML = d ? `<b>${longDate(d.date)}</b><br>${d.total ? `${int.format(d.total)} token, ${usd(d.cost)}` : "Nessun uso registrato"}` : `${hint} un giorno per leggerlo.`;
  } else if (kind === "tok") {
    $("#r-tok").innerHTML = d
      ? `<b>${longDate(d.date)}</b>, ${int.format(d.total)} token<br>` + SERIES.slice().reverse().map((s) => `<span class="it"><i class="sw" style="background:${s.hex}"></i>${s.label} ${compact(d[s.key])}</span>`).join("")
      : `${hint} una colonna per leggere quel giorno.`;
  } else if (kind === "cost") {
    if (!d) { $("#r-cost").innerHTML = `${hint} una colonna per leggere quel giorno.`; return; }
    let cum = 0; for (let k = 0; k <= i; k++) cum += S.list[k].cost;
    $("#r-cost").innerHTML = `<b>${longDate(d.date)}</b><br>${usd(d.cost)} quel giorno, ${usd(cum)} dall'inizio del periodo`;
  }
}

/* ── geometria delle pose ──────────────────────────────────── */
function svgEl(tag, attrs, parent, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function layCal() {
  const { list, n } = S, box = A.cal, Wd = box.clientWidth, labelW = 26, monthH = 20;
  const ov = $("#ov-cal"); ov.innerHTML = "";
  if (S.empty) { box.style.height = "0px"; P.cal = []; calGeom = null; return; }
  const lead = (parse(list[0].date).getDay() + 6) % 7, weeks = Math.ceil((lead + n) / 7);
  let cs = Math.floor((Wd - labelW) / weeks), gap, perBand;
  if (cs >= 12) { cs = Math.min(cs, 30); gap = cs > 18 ? 5 : 3; cs -= gap; perBand = weeks; }
  else { gap = 3; cs = 11; perBand = Math.max(1, Math.floor((Wd - labelW) / (cs + gap))); }
  const bands = Math.ceil(weeks / perBand), bandH = monthH + 7 * (cs + gap) + 22;
  box.style.height = bands * bandH - 22 + "px";
  ov.setAttribute("viewBox", `0 0 ${Wd} ${bands * bandH - 22}`);
  for (let b = 0; b < bands; b++) ["L", "", "M", "", "V", "", "D"].forEach((tx, r) => tx && svgEl("text", { x: 0, y: b * bandH + monthH + r * (cs + gap) + cs * .78 }, ov, tx));
  let lastM = -1, lastCol = -9, lastBand = -1;
  P.cal = list.map((d, i) => {

  if (tokAnim) { const t = clamp((now - tokAnim.t0) / 520), e = easeOut(t); for (const s of SERIES) W[s.key] = lerp(tokAnim.from[s.key], Wt[s.key], e); tokMax = lerp(tokAnim.m0, tokMaxT, e); if (t >= 1) tokAnim = null; dirty = true; }
  const st = TR.length ? stageState() : null;
  const sparkOn = st && ((st.a === "hero" && st.p < 1) || (st.b === "end" && st.p > 0) || st.a === "end");
  if (sparkOn && !reduced) {
    spin += dt * (Math.PI * 2 / 240);
    const kx = 60, c = 2 * Math.sqrt(kx);
    tiltVX += (kx * (tiltXt - tiltX) - c * tiltVX) * dt; tiltX += tiltVX * dt; tiltVY += (kx * (tiltYt - tiltY) - c * tiltVY) * dt; tiltY += tiltVY * dt;
    dirty = true;
  }
  for (const k in hm) { const t = H[k] >= 0 ? 1 : 0; if (Math.abs(hm[k] - t) > .004) { hm[k] = lerp(hm[k], t, 1 - Math.exp(-dt * 12)); dirty = true; } }
  glassFrame(dt, sy, velo);
  if (moving) {
    // la linea del totale si disegna con lo scroll e torna indietro con lo scroll
    if (cumEl) { const pr = clamp((sp + vh * .82 - R.cost.y) / (vh * .55)); if (Math.abs(pr - cumLast) > .002) { cumLast = pr; cumEl.setAttribute("stroke-dashoffset", (1 - pr).toFixed(4)); } }
    const mid = sy + vh * .5; let cur = "top";
    for (const s of FIELDS) if (mid >= s.top) cur = s.id;
    if (cur === "fine") cur = "mesi";
    if (cur !== activeNav) {
      activeNav = cur;
      document.querySelectorAll("#dock .press").forEach((b) => b.removeAttribute("aria-current"));
      const b = document.querySelector(`#dock [data-go="${cur}"]`); if (b) b.setAttribute("aria-current", "true");
      moveInd($("#dock"));
    }
  }
  if (dirty || moving) { draw(sy); dirty = false; }
}

/* ── puntatore sui grafici ─────────────────────────────────── */
let demo = null;
function setHover(kind, i) {
  if (H[kind] === i) return; H[kind] = i; dirty = true;
  if (kind === "hero") sparkReadout(i); else readout(kind, i);
}
function bindHit(kind, id, pick) {
  const el = $(id);
  const on = (e) => { const r = el.getBoundingClientRect(); demo = null; setHover(kind, pick(e.clientX - r.left, e.clientY - r.top, r)); };
  el.addEventListener("pointermove", on); el.addEventListener("pointerdown", on);
  el.addEventListener("pointerleave", () => { if (!coarse) setHover(kind, -1); });
}
bindHit("hero", "#hit-spark", (x, y, r) => {
  if (S.empty) return -1;
  const Rr = Math.min(r.width, r.height) / 2, dist = Math.hypot(x - r.width / 2, y - r.height / 2);
  if (dist < Rr * .2 || dist > Rr * 1.08) return -1;
  let best = -1, bd = 22; const o = {};
  for (let i = 0; i < S.n; i++) {
    sparkPose("hero", i, o, scrollY);
    const lx = o.x - r.left - x, ly = o.y - r.top - y, ca = Math.cos(o.ang), sa = Math.sin(o.ang);
    const along = clamp(-(lx * ca + ly * sa), -o.L / 2, o.L / 2), dd = Math.hypot(lx + along * ca, ly + along * sa);
    if (dd < bd) { bd = dd; best = i; }
  }
  return best;
});
bindHit("cal", "#hit-cal", (x, y) => {
  const g = calGeom; if (!g) return -1;
  const b = Math.floor(y / g.bandH), r = Math.floor((y - b * g.bandH - g.monthH) / (g.cs + g.gap)), wc = Math.floor((x - g.labelW) / (g.cs + g.gap));
  if (r < 0 || r > 6 || wc < 0 || wc >= g.perBand) return -1;
  const i = (b * g.perBand + wc) * 7 + r - g.lead; return i >= 0 && i < S.n ? i : -1;
});
bindHit("tok", "#hit-tok", (x) => { const g = tokGeom; if (!g) return -1; const i = Math.floor((x - g.ox) / g.bw); return i >= 0 && i < S.n ? i : -1; });
bindHit("cost", "#hit-cost", (x) => { const g = costGeom; if (!g) return -1; const i = Math.floor((x - g.ox) / g.bw); return i >= 0 && i < S.n ? i : -1; });
addEventListener("pointermove", (e) => {
  px = e.clientX; py = e.clientY; pMoved = true;
  if (!coarse) { tiltYt = .34 + (e.clientX / vw - .5) * .6; tiltXt = -.44 - (e.clientY / vh - .5) * .5; }
}, { passive: true });

$("#kinds").addEventListener("click", (e) => {
  const b = e.target.closest(".kind"); if (!b || !tokGeom) return;
  const k = b.dataset.k;
  if (active.has(k) && active.size > 1) active.delete(k); else active.add(k);
  b.setAttribute("aria-pressed", active.has(k));
  SERIES.forEach((s) => (Wt[s.key] = active.has(s.key) ? 1 : 0));
  tokMaxT = tokTarget();
  tokGeom.labels.forEach((t, j) => (t.textContent = compact((tokMaxT / 5) * j)));
  if (reduced) { SERIES.forEach((s) => (W[s.key] = Wt[s.key])); tokMax = tokMaxT; dirty = true; }
  else tokAnim = { t0: performance.now(), from: { ...W }, m0: tokMax };
});

/* ── comandi ───────────────────────────────────────────────── */
function setGrow(to, dur, stag = 1) { growFrom = grow; growTo = to; growT0 = performance.now(); growDur = reduced ? 1 : dur; growStag = stag; }
function fillCompo() { requestAnimationFrame(() => $("#compo").querySelectorAll("i").forEach((i) => (i.style.flexGrow = i.dataset.g))); }
function replay() {
  const els = [...document.querySelectorAll("[data-in].in"), $("#h-hero"), $("#heroWrap")];
  els.forEach((e) => e.classList.remove("in")); void document.body.offsetWidth; els.forEach((e) => e.classList.add("in"));
  if ($("#tokTxt").classList.contains("in")) fillCompo();
}
function rebuild() {
  compute(); renderText(); tokGeom = null; tokAnim = null;
  SERIES.forEach((s) => { W[s.key] = Wt[s.key] = active.has(s.key) ? 1 : 0; });
  for (const k in H) H[k] = -1;
  layout();
}
$("#range").addEventListener("click", (e) => {
  const b = e.target.closest("[data-range]"); if (!b || b.dataset.range === S.range) return;
  $("#range").querySelectorAll(".press").forEach((x) => x.setAttribute("aria-pressed", x === b));
  moveInd($("#range"));
  try { localStorage.setItem("cud-range", b.dataset.range); } catch (_) {}
  const next = b.dataset.range; demo = null;
  setGrow(0, 260, .2);
  setTimeout(() => { S.range = next; rebuild(); replay(); setGrow(1, 1000, 1); }, reduced ? 0 : 280);
});
function goTo(id) { const el = document.getElementById(id); if (el) scrollTo({ top: id === "top" ? 0 : docRect(el).y + 2, behavior: reduced ? "auto" : "smooth" }); }
$("#dock").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) goTo(b.dataset.go); });
$("#brand").addEventListener("click", () => goTo("top"));

const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return; e.target.classList.add("in"); io.unobserve(e.target);
  if (e.target.id === "tokTxt") fillCompo();
}), { threshold: .15, rootMargin: "0px 0px -8% 0px" });

/* ── apertura: i giorni si contano mentre la scintilla si compone, poi il buio si chiude nel suo centro ── */
function reveal() {
  $("#h-hero").classList.add("in"); $("#heroWrap").classList.add("in");
  setTimeout(() => glassEls.forEach((g, i) => setTimeout(() => g.classList.add("on"), i * 110)), 250);
  document.querySelectorAll("[data-in]").forEach((n) => io.observe(n));
}
function opening() {
  const cover = $("#cover");
  if (reduced || S.empty) { cover.classList.add("gone"); grow = growTo = 1; introCol = 1; dirty = true; reveal(); return; }
  cv.classList.add("front");
  const rc = A.hero.getBoundingClientRect(), cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2, read = $("#coverRead"), numEl = $("#coverNum");
  read.style.left = cx + "px"; read.style.top = cy + "px";
  const full = Math.hypot(Math.max(cx, vw - cx), Math.max(cy, vh - cy)) + 40;
  const T_GROW = 1350, T_HOLD = 250, T_IRIS = 900; let t0 = performance.now(), revealed = false;
  setGrow(1, T_GROW, 1);
  cover.addEventListener("pointerdown", () => { if (performance.now() - t0 < T_GROW + T_HOLD) { t0 = performance.now() - T_GROW - T_HOLD; grow = growTo = 1; dirty = true; } }, { once: true });
  (function tick(now) {
    const t = now - t0;
    numEl.textContent = Math.round(S.n * easeOut(clamp(t / T_GROW)));
    if (t > T_GROW + T_HOLD - 120) cover.classList.add("closing");
    const q = clamp((t - T_GROW - T_HOLD) / T_IRIS);
    if (q > 0) { const e = easeIO(q); cover.style.clipPath = `circle(${(full * (1 - e)).toFixed(1)}px at ${cx}px ${cy}px)`; introCol = e; dirty = true; }
    if (q > .35 && !revealed) { revealed = true; reveal(); }
    if (q < 1) return requestAnimationFrame(tick);
    cover.classList.add("gone"); cv.classList.remove("front"); introCol = 1; dirty = true;
    // dimostrazione: il segno percorre i giorni da solo e si ferma sul più intenso. Si annulla al primo gesto.
    if (!coarse && S.iMax >= 0) {
      demo = { t0: performance.now() + 500 };
      (function sweep(n2) {
        if (!demo) return; const tt = clamp((n2 - demo.t0) / 2200);
        if (tt > 0) setHover("hero", Math.min(S.n - 1, Math.round(easeIO(tt) * S.iMax)));
        if (tt < 1) requestAnimationFrame(sweep); else setTimeout(() => { if (demo) { demo = null; setHover("hero", -1); } }, 1600);
      })(performance.now());
    }
  })(performance.now());
}

/* ── avvio ─────────────────────────────────────────────────── */
try { const saved = localStorage.getItem("cud-range"); if (saved && RANGE_NAMES[saved]) { S.range = saved; $("#range").querySelectorAll(".press").forEach((x) => x.setAttribute("aria-pressed", x.dataset.range === saved)); } } catch (_) {}
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
scrollTo(0, 0);
resizeStage(); rebuild();
let rw = innerWidth, rt = 0;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { resizeStage(); if (Math.abs(innerWidth - rw) > 2) { rw = innerWidth; tokGeom = null; } layout(); }, 140); });
let mainH = 0;
new ResizeObserver((es) => { const h = es[0].contentRect.height; if (Math.abs(h - mainH) < 2) return; mainH = h; clearTimeout(rt); rt = setTimeout(layout, 140); }).observe($("#main"));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layout(); opening(); requestAnimationFrame(frame); });
})();
</script>
