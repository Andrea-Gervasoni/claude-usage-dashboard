name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm test
      - name: The launcher starts
        run: node bin/vibecrab.mjs --version
      - name: Build the page from an empty history
        run: node scripts/build.mjs
      - name: Build the demo page
        run: node scripts/pages.mjs
